# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: arcane-guilds
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
